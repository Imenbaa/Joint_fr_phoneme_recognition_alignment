[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "JointRecAlign"
version = "0.1.0"
description = "Joint phone recognition and alignment with wav2vec2 (CTC + cross-attention aligner)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ImenBA" }]
requires-python = ">=3.10"
keywords = ["phone recognition", "forced alignment", "wav2vec2", "CTC", "speech", "phonetics",
            "French", "Praat", "TextGrid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Inference and evaluation (JointRecAlign, evaluate.py). The exact versions used to train the
# models are in requirements.txt.
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.41",
    "numpy",
    "soundfile",
    "soxr",
    "Levenshtein",
    "jiwer",
    "silero-vad>=6.2",
]

[project.optional-dependencies]
# Training (train_ctc.py, train_aligner.py).
train = ["datasets", "accelerate", "editdistance", "tensorboard"]
# Evaluation (evaluate.py, the DTW decode, the metric tables); requirements.txt has them too.
eval = ["librosa", "pandas"]

[project.urls]
Homepage = "https://github.com/Imenbaa/Joint_phoneme_recognition_alignment"
Repository = "https://github.com/Imenbaa/Joint_phoneme_recognition_alignment"
Documentation = "https://github.com/Imenbaa/Joint_phoneme_recognition_alignment/blob/main/GUIDE.md"
Issues = "https://github.com/Imenbaa/Joint_phoneme_recognition_alignment/issues"
"Model release" = "https://github.com/Imenbaa/Joint_phoneme_recognition_alignment/releases/tag/v0.1.0"

[project.scripts]
JointRecAlign = "jointrecalign.transcribe_cli:main"
JointRecAlign-transcribe = "jointrecalign.transcribe_cli:main_transcribe"

[tool.setuptools]
packages = ["jointrecalign", "jointrecalign.evaluation"]

[tool.setuptools.package-data]
jointrecalign = ["praat_plugin/*.praat", "report_assets/*.html"]
